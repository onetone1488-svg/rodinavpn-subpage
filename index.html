<!DOCTYPE html>
<html lang="ru" class="dark" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="<%- metaDescription %>" />
  <title><%- metaTitle %></title>

  <!-- EJS: base64-encoded JSON с данными подписки. Фоллбэк в JS если не заменился. -->
  <script>window.__REMNA_PANEL_DATA__='<%- panelData %>';</script>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%23111827%22/%3E%3Ctext%20x%3D%2216%22%20y%3D%2222%22%20font-family%3D%22Manrope%2C%20sans-serif%22%20font-size%3D%2218%22%20font-weight%3D%22800%22%20fill%3D%22%23ee9959%22%20text-anchor%3D%22middle%22%3ER%3C/text%3E%3C/svg%3E"/>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ============================================================
       RodinaVPN Subscription Page
       Стиль: cabinet.rodinavpn.tech
       ============================================================ */

    :root {
      /* dark palette */
      --color-bg: #0a0e1a;
      --color-surface: #111827;
      --color-surface-2: #1a2236;
      --color-border: rgba(255, 255, 255, 0.07);
      --color-border-strong: rgba(255, 255, 255, 0.12);
      --color-text: #f0f4ff;
      --color-text-muted: rgba(240, 244, 255, 0.55);
      --color-text-dim: rgba(240, 244, 255, 0.30);
      --color-text-faint: rgba(240, 244, 255, 0.20);

      /* accent (оранжевый родинавпн) */
      --color-accent-400: 238, 153, 89;   /* #ee9959 */
      --color-accent-500: 231, 114, 24;   /* #e77218 */
      --color-accent-600: 194, 96, 20;

      /* status */
      --color-success: 37, 218, 103;
      --color-warning: 231, 114, 24;
      --color-error: 235, 20, 20;

      /* glass card */
      --card-bg: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
      --card-bg-hover: linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.03) 100%);
      --card-border: 1px solid rgba(255, 255, 255, 0.07);

      /* sparkles */
      --sparkle-color: 238, 153, 89;

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;

      --shadow-card: 0 4px 30px rgba(0,0,0,0.15);

      --font-text: 'Manrope', system-ui, -apple-system, sans-serif;
      --font-display: 'Outfit', system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', 'SF Mono', Monaco, monospace;
    }

    html.light {
      --color-bg: #f0f4ff;
      --color-surface: #ffffff;
      --color-surface-2: #fbfcff;
      --color-border: rgba(10, 14, 26, 0.08);
      --color-border-strong: rgba(10, 14, 26, 0.15);
      --color-text: #0a0e1a;
      --color-text-muted: rgba(10, 14, 26, 0.60);
      --color-text-dim: rgba(10, 14, 26, 0.35);
      --color-text-faint: rgba(10, 14, 26, 0.20);

      --card-bg: linear-gradient(145deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.85) 100%);
      --card-bg-hover: linear-gradient(145deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0.95) 100%);
      --card-border: 1px solid rgba(10, 14, 26, 0.06);
      --shadow-card: 0 4px 30px rgba(10, 14, 26, 0.06);
    }

    html[dir="rtl"] body { direction: rtl; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ============================================================
       Sparkles canvas (фон)
       ============================================================ */
    #sparkles-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }
    html.light #sparkles-canvas { opacity: 0.5; }

    /* ============================================================
       Layout
       ============================================================ */
    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: color-mix(in srgb, var(--color-bg) 90%, transparent);
      border-bottom: 1px solid var(--color-border);
    }
    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .brand-logo {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .brand-logo img { width: 100%; height: 100%; object-fit: contain; }
    .brand-logo-fallback {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 16px;
      color: rgb(var(--color-accent-400));
    }
    .brand-name {
      font-weight: 700;
      font-size: 15px;
      color: var(--color-text);
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--card-bg);
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: var(--card-bg-hover);
      color: rgb(var(--color-accent-400));
      border-color: var(--color-border-strong);
    }
    .btn-icon svg { width: 18px; height: 18px; }

    .lang-switch {
      position: relative;
    }
    .lang-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 0 10px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--card-bg);
      color: var(--color-text);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .lang-btn:hover { background: var(--card-bg-hover); }
    .lang-btn .chev { width: 12px; height: 12px; opacity: 0.5; transition: transform 0.2s; }
    .lang-switch.open .lang-btn .chev { transform: rotate(180deg); }
    .lang-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 140px;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      box-shadow: var(--shadow-card);
      display: none;
      z-index: 60;
    }
    .lang-switch.open .lang-menu { display: block; }
    .lang-menu button {
      display: flex; align-items: center; gap: 8px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      transition: background 0.15s;
    }
    .lang-menu button:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
    .lang-menu button.active { background: rgba(var(--color-accent-400), 0.1); color: rgb(var(--color-accent-400)); }

    /* ============================================================
       Main
       ============================================================ */
    main {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 16px 48px;
    }

    .hero { margin-bottom: 20px; }
    .hero-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--color-text);
      line-height: 1.15;
    }
    @media (min-width: 640px) { .hero-title { font-size: 32px; } }
    .hero-sub {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .hero-sub p { color: var(--color-text-muted); font-size: 14px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(var(--color-accent-400), 0.1);
      border: 1px solid rgba(var(--color-accent-400), 0.2);
      color: rgb(var(--color-accent-400));
    }
    .badge.success {
      background: rgba(var(--color-success), 0.1);
      border-color: rgba(var(--color-success), 0.25);
      color: rgb(var(--color-success));
    }
    .badge.error {
      background: rgba(var(--color-error), 0.1);
      border-color: rgba(var(--color-error), 0.25);
      color: rgb(var(--color-error));
    }
    .badge svg { width: 10px; height: 10px; }

    /* ============================================================
       Glass card
       ============================================================ */
    .card {
      position: relative;
      overflow: hidden;
      background: var(--card-bg);
      border: var(--card-border);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow-card);
      padding: 24px;
    }
    @media (min-width: 640px) { .card { padding: 28px; } }
    .card.compact { padding: 18px 20px; }
    .card .glow {
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--color-accent-400), 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ============================================================
       Traffic card
       ============================================================ */
    .traffic-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
    }
    .traffic-label {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .traffic-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgb(var(--color-accent-400));
      box-shadow: 0 0 8px rgba(var(--color-accent-400), 0.5);
    }
    .traffic-status {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgb(var(--color-accent-400));
    }
    .traffic-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .traffic-percent {
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      text-align: right;
    }
    .traffic-percent .pct {
      font-size: 18px;
      font-weight: 500;
      color: var(--color-text-dim);
      margin-left: 1px;
    }
    .traffic-bytes {
      margin-top: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text-dim);
      text-align: right;
    }

    .progress-wrap { margin-bottom: 8px; }
    .progress {
      position: relative;
      height: 14px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--color-text) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-text) 4%, transparent);
      overflow: hidden;
    }
    .progress-zones {
      position: absolute; inset: 0;
      display: flex;
    }
    .progress-zones > div:nth-child(1) { flex: 50; }
    .progress-zones > div:nth-child(2) { flex: 25; background: rgba(var(--color-warning), 0.03); }
    .progress-zones > div:nth-child(3) { flex: 15; background: rgba(var(--color-warning), 0.04); }
    .progress-zones > div:nth-child(4) { flex: 10; background: rgba(var(--color-error), 0.05); }

    .progress-fill {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      border-radius: 10px;
      overflow: hidden;
      transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      background: rgb(var(--color-accent-400));
    }
    .progress-fill .shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
      animation: shimmer 2.2s linear infinite;
    }
    .progress-fill .top-shine {
      position: absolute; top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(rgba(255,255,255,0.25) 0%, transparent 100%);
      border-radius: 10px 10px 0 0;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes shimmer-unlim {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .progress-divider {
      position: absolute; top: 0; bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.08);
    }
    html.light .progress-divider { background: rgba(10,14,26,0.08); }
    .progress-glow {
      position: absolute;
      top: -4px; bottom: -4px;
      width: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--color-accent-400), 0.38), transparent);
      filter: blur(4px);
      pointer-events: none;
      transition: left 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .progress-scale {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 500;
      color: var(--color-text-faint);
    }

    /* ============================================================
       Info grid (тариф / срок / устройства)
       ============================================================ */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }
    .info-card {
      padding: 14px;
      border-radius: var(--radius-md);
      background: rgba(var(--color-accent-400), 0.04);
      border: 1px solid rgba(var(--color-accent-400), 0.08);
    }
    .info-card.neutral {
      background: color-mix(in srgb, var(--color-text) 3%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-text) 4%, transparent);
    }
    .info-card-label {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgb(var(--color-accent-400));
    }
    .info-card.neutral .info-card-label { color: var(--color-text-dim); }
    .info-card-icon {
      width: 22px; height: 22px;
      border-radius: 6px;
      background: rgba(var(--color-accent-400), 0.1);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .info-card.neutral .info-card-icon {
      background: color-mix(in srgb, var(--color-text) 5%, transparent);
    }
    .info-card-icon svg { width: 12px; height: 12px; }
    .info-card-value {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
    }
    .info-card-value .unit {
      font-family: var(--font-text);
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-dim);
      margin-left: 4px;
    }
    .info-card-sub {
      margin-top: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-dim);
    }

    .devices-card {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border-radius: var(--radius-md);
      background: var(--card-bg);
      border: var(--card-border);
    }
    .devices-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(var(--color-accent-400), 0.07);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .devices-icon svg { width: 16px; height: 16px; stroke: rgb(var(--color-accent-400)); }
    .devices-text { flex: 1; min-width: 0; }
    .devices-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .devices-sub { margin-top: 2px; font-size: 11px; color: var(--color-text-dim); }
    .devices-dots { display: flex; gap: 5px; flex-shrink: 0; }
    .devices-dots .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--color-text) 8%, transparent);
    }
    .devices-dots .dot.on {
      background: rgb(var(--color-accent-400));
      box-shadow: 0 0 6px rgba(var(--color-accent-400), 0.4);
    }

    /* ============================================================
       Section header
       ============================================================ */
    .section { margin-top: 28px; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 2px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }
    .section-hint {
      font-size: 11px;
      color: var(--color-text-faint);
      font-family: var(--font-mono);
    }

    /* ============================================================
       Install steps (Happ)
       ============================================================ */
    .platform-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      padding: 4px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--color-text) 3%, transparent);
      border: 1px solid var(--color-border);
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .platform-tabs::-webkit-scrollbar { display: none; }
    .platform-tab {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
      transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    @media (min-width: 640px) {
      .platform-tab { flex: 1; justify-content: center; }
    }
    .platform-tab:hover { color: var(--color-text); background: color-mix(in srgb, var(--color-text) 4%, transparent); }
    .platform-tab.active {
      background: rgba(var(--color-accent-400), 0.12);
      color: rgb(var(--color-accent-400));
      box-shadow: inset 0 0 0 1px rgba(var(--color-accent-400), 0.2);
    }
    .platform-tab svg { width: 14px; height: 14px; }

    .steps { display: flex; flex-direction: column; gap: 12px; }
    .step {
      display: flex; gap: 14px;
      padding: 16px;
      border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--color-text) 2%, transparent);
      border: 1px solid var(--color-border);
    }
    .step-num {
      flex-shrink: 0;
      width: 28px; height: 28px;
      border-radius: 8px;
      background: rgba(var(--color-accent-400), 0.1);
      color: rgb(var(--color-accent-400));
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .step-body { flex: 1; min-width: 0; }
    .step-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .step-desc {
      font-size: 13px;
      color: var(--color-text-muted);
      line-height: 1.5;
    }
    .step-buttons {
      margin-top: 12px;
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .step-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      transition: all 0.2s;
    }
    .step-btn:hover {
      background: color-mix(in srgb, var(--color-text) 8%, var(--color-surface-2));
      border-color: var(--color-border-strong);
    }
    .step-btn.primary {
      background: rgb(var(--color-accent-500));
      color: white;
      border-color: rgb(var(--color-accent-500));
      box-shadow: 0 4px 16px rgba(var(--color-accent-500), 0.3);
    }
    .step-btn.primary:hover {
      background: rgb(var(--color-accent-600));
      border-color: rgb(var(--color-accent-600));
      transform: translateY(-1px);
    }
    .step-btn svg { width: 14px; height: 14px; }

    /* ============================================================
       Action grid (4 кнопки: канал/чат/бот/поддержка)
       ============================================================ */
    .actions {
      margin-top: 24px;
      display: grid;

  const LOCALE_ORDER = ['ru', 'en', 'zh', 'fa', 'fr'];

  /* =========================================================================
     Подписочные данные
     Источники приоритета:
       1. window.__REMNA_PANEL_DATA__ (EJS panelData — base64 JSON, основной)
       2. window.__SUBSCRIPTION_INFO__ (для тестирования)
       3. mock для локального превью
     ========================================================================= */

  const MOCK = {
    username: 'anon',
    used_bytes: 9.9 * 1024 * 1024 * 1024,
    total_bytes: 250 * 1024 * 1024 * 1024,
    expire_at: new Date(Date.now() + 364 * 24 * 60 * 60 * 1000).toISOString(),
    is_active: true,
    subscription_url: window.location.origin + window.location.pathname,
    happ_link: 'happ://add/' + encodeURIComponent(window.location.origin + window.location.pathname),
    devices_used: 1,
    devices_total: 5,
    tariff_name: 'ULTRA'
  };

  function loadSubscriptionData() {
    // 1. EJS panelData (base64 JSON) — работает когда страница отдаётся Remnawave бэкендом
    const raw = window.__REMNA_PANEL_DATA__;
    if (raw && typeof raw === 'string' && raw.length > 10 && !raw.includes('\x3C%')) {
      try {
        const parsed = JSON.parse(atob(raw));
        return Promise.resolve(normalize(parsed));
      } catch (e) {
        console.warn('panelData parse error:', e);
      }
    }
    // 2. Ручной инжект для тестирования (через init_script playwright или консоль)
    if (window.__SUBSCRIPTION_INFO__) return Promise.resolve(normalize(window.__SUBSCRIPTION_INFO__));
    // 3. Mock для локального превью
    return Promise.resolve(normalize(MOCK));
  }

  function normalize(d) {
    // Реальная структура Remnawave:
    // { response: { isFound, subscriptionUrl, user: { trafficUsedBytes, trafficLimitBytes, expiresAt, userStatus, username } } }
    const resp = d.response || d;
    const user = resp.user || resp;

    const used  = Number(user.trafficUsedBytes ?? user.usedTrafficBytes ?? user.used_bytes ?? 0);
    const total = Number(user.trafficLimitBytes ?? user.dataLimitBytes ?? user.total_bytes ?? 0);
    const expire = user.expiresAt ?? user.expireAt ?? user.expire_at ?? null;
    const sub_url = resp.subscriptionUrl ?? user.subscriptionUrl ?? user.subscription_url
                    ?? window.location.href.split('#')[0].split('?')[0];
    // happCrypt4Link может не приходить — строим через btoa
    const happ = resp.happCrypt4Link ?? user.happCrypt4Link ?? user.happ_link
                 ?? ('happ://add/' + btoa(sub_url));
    const devUsed  = Number(user.hwidDevicesCount ?? user.usedDevices ?? user.devices_used ?? 0);
    const devTotal = Number(user.hwidDeviceLimit ?? user.deviceLimit ?? user.devices_total ?? 0);
    const tariff = user.tariffName ?? user.tariff_name ?? user.tariff ?? '';
    const active = (user.userStatus === 'ACTIVE') || user.isActive === true || d.is_active === true;

    return {
      username: user.username || 'anon',
      used_bytes: used,
      total_bytes: total,
      expire_at: expire,
      is_active: active !== false,
      subscription_url: sub_url,
      happ_link: happ,
      devices_used: devUsed,
      devices_total: devTotal,
      tariff_name: tariff
    };
  }

  function pickLocale() {
    const n = (navigator.language || 'ru').toLowerCase();
    if (n.startsWith('en')) return 'en';
    if (n.startsWith('zh')) return 'zh';
    if (n.startsWith('fa')) return 'fa';
    if (n.startsWith('fr')) return 'fr';
    return 'ru';
  }

  function detectPlatform() {
    const ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/.test(ua)) return 'ios';
    if (/Android/.test(ua)) return 'android';
    if (/Mac/.test(ua)) return 'macos';
    if (/Windows/.test(ua)) return 'windows';
    return 'ios';
  }

  function t(key, vars) {
    const dict = I18N[state.locale] || I18N.ru;
    let v = key.split('.').reduce((o, k) => (o ? o[k] : undefined), dict);
    if (v == null) v = key.split('.').reduce((o, k) => (o ? o[k] : undefined), I18N.ru);
    if (typeof v !== 'string') return v ?? key;
    if (vars) for (const k in vars) v = v.replace('{' + k + '}', vars[k]);
    return v;
  }

    const meta = document.querySelector('meta[name="theme-color"]');

  /* =========================================================================
     Sparkles canvas
     Жёлто-оранжевые искры — то появляются, то исчезают
     ========================================================================= */
  (function sparkles() {
    const canvas = document.getElementById('sparkles-canvas');
    const ctx = canvas.getContext('2d');
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w, h, particles = [];

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(80, Math.floor(w * h / 18000));
      particles = [];
      for (let i = 0; i < count; i++) particles.push(spawn());
    }

    function spawn(reset) {
      const lifeMax = 2200 + Math.random() * 3000;
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        r: 0.5 + Math.random() * 1.8,
        life: reset ? 0 : Math.random() * lifeMax,
        lifeMax,
        twinkle: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.001 + Math.random() * 0.003
      };
    }

    let last = performance.now();
    function tick(now) {
      const dt = Math.min(40, now - last);
      last = now;
      ctx.clearRect(0, 0, w, h);
      for (let p of particles) {
        p.life += dt;
        p.twinkle += p.twinkleSpeed * dt;
        if (p.life >= p.lifeMax) {
          Object.assign(p, spawn(true));
          p.x = Math.random() * w;
          p.y = Math.random() * h;
        }
        // fade in / out
        const t = p.life / p.lifeMax;
        const envelope = Math.sin(t * Math.PI); // 0..1..0
        const sparkle = 0.5 + 0.5 * Math.sin(p.twinkle);
        const alpha = envelope * (0.3 + 0.7 * sparkle) * 0.85;
        if (alpha <= 0.01) continue;
        // Цвет — берём из CSS var
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(238, 153, 89, ${alpha})`;
        ctx.fill();
        // мягкое свечение
        if (p.r > 1) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 2.6, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(238, 153, 89, ${alpha * 0.10})`;
          ctx.fill();
        }
      }
      requestAnimationFrame(tick);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(tick);
  })();

  /* =========================================================================
     Formatters
     ========================================================================= */
  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatBytes(b, alwaysFrac) {
    if (!b || b < 0) return '0 B';
    const u = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0; let v = b;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    let frac = alwaysFrac ? 1 : (v < 10 ? 1 : 0);
    // если целое — обходимся без дробной части
    if (!alwaysFrac && Math.abs(v - Math.round(v)) < 0.05) frac = 0;
    return v.toFixed(frac) + ' ' + u[i];
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const fmt = new Intl.DateTimeFormat(state.locale === 'zh' ? 'zh-CN' : state.locale, {
      day: '2-digit', month: '2-digit', year: 'numeric'
    });
    return fmt.format(d);
  }

  function daysLeft(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    if (isNaN(d)) return null;
    return Math.max(0, Math.ceil((d - Date.now()) / 86400000));
  }

  function renderTraffic() {
    const s = state.sub;
    document.getElementById('traffic-title').textContent = t('traffic_title');

    const unlim = s.total_bytes <= 0;
    const pct = unlim ? 0 : Math.min(100, (s.used_bytes / s.total_bytes) * 100);

    let statusKey = 'traffic_norm', color = 'var(--color-accent-400)';
    if (unlim) statusKey = 'traffic_unlim';
    else if (pct >= 90) { statusKey = 'traffic_critical'; }
    else if (pct >= 75) { statusKey = 'traffic_attention'; }

    document.getElementById('traffic-status').textContent = t(statusKey);
    document.getElementById('traffic-percent-val').textContent = unlim ? '∞' : pct.toFixed(pct < 10 ? 1 : 0);
    document.querySelector('.traffic-percent .pct').style.display = unlim ? 'none' : '';

    if (unlim) {
      document.getElementById('traffic-bytes').textContent = formatBytes(s.used_bytes) + ' / ∞';
    } else {
      document.getElementById('traffic-bytes').textContent =
        formatBytes(s.used_bytes) + ' / ' + formatBytes(s.total_bytes);
    }

    requestAnimationFrame(() => {
      const fill = document.getElementById('progress-fill');
      const glow = document.getElementById('progress-glow');
      const bar = document.getElementById('progressbar');
      if (unlim) {
        // безлимит: вместо заливки — мягкая бегущая полоса по всей ширине
        fill.style.width = '100%';
        fill.style.background = 'linear-gradient(90deg, rgba(238,153,89,0.45), rgba(238,153,89,0.85), rgba(238,153,89,0.45))';
        fill.style.backgroundSize = '200% 100%';
        fill.style.animation = 'shimmer-unlim 4s linear infinite';
        glow.style.display = 'none';
        bar.setAttribute('aria-valuenow', '0');
      } else {
        fill.style.width = pct + '%';
        fill.style.background = '';
        fill.style.backgroundSize = '';
        fill.style.animation = '';
        glow.style.display = '';
        glow.style.left = `calc(${pct}% - 8px)`;
        bar.setAttribute('aria-valuenow', String(pct.toFixed(0)));
      }
    });

    // шкала
    const total = s.total_bytes;
    const scale = document.getElementById('progress-scale');
    if (unlim || total <= 0) {
      scale.innerHTML = '<span>0</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>';
    } else {
      const marks = [0, 0.25, 0.5, 0.75, 1].map(m => formatBytes(total * m, true));
      scale.innerHTML = marks.map(m => '<span>' + m + '</span>').join('');
    }
  }

      const img = document.createElement('img');
      img.alt = b.title || 'logo';
      img.src = b.logoUrl;
      img.onerror = () => {
        wrap.innerHTML = '<span class="brand-logo-fallback">R</span>';
      };
      wrap.innerHTML = '';
      wrap.appendChild(img);
    }
  }

  /* =========================================================================
     Init
     ========================================================================= */
  document.addEventListener('DOMContentLoaded', async () => {
    applyTheme(state.theme);
    applyLocale(state.locale);
    buildLangMenu();

    // theme toggle
    document.getElementById('theme-toggle').onclick = () => {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark');
    };

    // lang dropdown
    document.getElementById('lang-btn').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('lang-switch').classList.toggle('open');
    };
    document.addEventListener('click', () => {
      document.getElementById('lang-switch').classList.remove('open');
    });

    applyBranding();

    // load subscription
    state.sub = await loadSubscriptionData();
    renderAll();
  });
  </script>
</body>
</html>
